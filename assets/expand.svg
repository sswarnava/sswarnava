<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 40" width="420" height="40" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- pulsing ring (bip bip) -->
  <rect x="6" y="6" width="408" height="28" rx="14" fill="none" stroke="#2F81F7" stroke-width="2" stroke-opacity="0.9">
    <animate attributeName="x" values="6;0" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="6;0" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="408;420" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="28;40" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="14;20" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <!-- pill -->
  <rect x="6" y="6" width="408" height="28" rx="14" fill="#2F81F7">
    <animate attributeName="fill-opacity" values="1;0.82;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <!-- bouncing arrows -->
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 16 l6 6 l6 -6">
      <animateTransform attributeName="transform" type="translate" values="0 -1;0 3;0 -1" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M388 16 l6 6 l6 -6">
      <animateTransform attributeName="transform" type="translate" values="0 -1;0 3;0 -1" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="210" y="24.5" text-anchor="middle" fill="#fff" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">Click to expand · Challenges · Stack · Outcome</text>
</svg>
